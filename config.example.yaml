# Behaviour lives here; secrets live in .env. This file is safe to commit.

database: tmbot.sqlite3
log_level: INFO

# Display language: en or ar. Alerts, commands and reports are translated;
# stored records and log lines stay English so they remain portable and
# searchable. Switch at any time with /lang ar or /lang en -- it re-renders
# text only and never touches an open trade or a database row.
language: en

broker:
  # Which broker connection to use:
  #   capital  Capital.com's API (logs in with an API key)
  #   mt5      a MetaTrader 5 terminal on this Windows PC -- Exness or any
  #            other MT5 broker (logs in with account number, password, server)
  platform: capital

  # Only read when platform is mt5.
  mt5:
    # MT5 timestamps are in the broker's server time. Exness uses UTC (0);
    # many other brokers use 2 or 3.
    server_utc_offset_hours: 0
    # How far a close may slip from the quoted price, in points.
    deviation_points: 30

  # The environment is chosen on the command line (--env demo|live) and has no
  # default on purpose. Credentials for each live in .env.
  #
  # Live trading needs BOTH of these: live_enabled true here, and --env live
  # on the command line. Either one alone is refused.
  live_enabled: false
  timeout: 20.0
  retry_attempts: 5
  circuit_threshold: 5
  circuit_cooldown: 90.0
  # probe | netting_offset | delete_with_size
  partial_close_strategy: probe

management:
  poll_seconds: 10.0
  management_timeframe: M15

  # How the trade is taken off. Two models:
  #
  #   partial_close  You open ONE deal. It is sliced by `ladder` below:
  #                  50% closed at TP1, 25% at TP2, the rest rides to TP3.
  #                  Works on any account.
  #
  #   three_deals    You open THREE deals at once. Each is closed WHOLE at its
  #                  own target: first deal at TP1, second at TP2, third at TP3.
  #                  Needs hedging mode ON at Capital.com, or the broker merges
  #                  the three into one position and the legs cannot be closed
  #                  separately. The bot warns you at startup if that is the case.
  exit_model: three_deals

  # three_deals only: which target closes which deal, in the order the deals
  # were opened. Deals on the same instrument and side opened within
  # group_window_minutes of each other are treated as one basket, and one
  # /confirm adopts all of them.
  leg_targets: [TP1, TP2, TP3]
  group_window_minutes: 15.0

  # partial_close only. Fractions are of the ORIGINAL position size, rounded
  # down to the instrument's increment so the runner is never over-closed.
  ladder:
    - {stage: TP1, fraction: 0.50}
    - {stage: TP2, fraction: 0.25}

  # Both models: stop goes to the exact entry price the moment TP1 trades.
  # In three_deals mode that applies to every leg still open.
  # When the 1% risk limit only allows fewer deals:
  two_leg_targets: [TP1, TP3]   # deal 1 banks TP1, deal 2 rides to TP3
  one_leg_targets: [TP1]

  breakeven_stage: TP1
  breakeven_offset_r: 0.0

  # Halfway stop: once price has covered risk_cut_at of the way to TP1, the
  # stop is pulled in so only risk_cut_to of the original risk is left.
  # 0.5 / 0.5 = halfway to TP1, half the risk. risk_cut_at: 0 turns it off.
  risk_cut_at: 0.5
  risk_cut_to: 0.5

  # ATR chandelier with a market-structure floor, active once TP1 is banked.
  # In three_deals mode only the final leg is trailed -- the others have their
  # own targets and must not be trailed out of them.
  trail_after_stage: TP1          # TP1 | TP2 | ENTRY | NEVER
  trail_atr_period: 14
  trail_k_strong: 2.5             # ADX >= adx_strong
  trail_k_moderate: 3.0           # ADX >= adx_moderate
  trail_when_weak: false          # a weak trend holds the stop where it is
  structure_buffer_atr: 0.25
  adx_strong: 25.0
  adx_moderate: 18.0
  min_stop_improvement_atr: 0.10  # ignore sub-tick nudges

  # In a strong trend, push TP3 out rather than exiting into momentum.
  extend_tp3: true
  tp3_extension_atr: 1.0
  tp3_extension_trigger_atr: 0.5
  tp3_max_extensions: 3

  on_indivisible_size: hold       # hold | close_all
  max_quote_age_seconds: 90.0
  adoption_confirm_timeout_minutes: 30.0
  auto_decline_on_timeout: true

# Trend-reversal failsafe. The bot NEVER opens a position to recover -- no
# hedging, no averaging down. It protects what is already there.
reversal:
  enabled: true
  min_signals: 2          # of 4: DI cross, structure break, EMA cross, momentum flip
  confirm_cycles: 2       # consecutive detections before acting -- one bar is noise
  adx_min: 20.0           # below this there is no trend to reverse
  action: tighten         # tighten | close | alert
  tighten_atr: 1.0        # pull the stop this many ATR behind price
  min_r_to_act: 0.0       # below this, alert only -- acting would mean widening risk
  cooldown_minutes: 60.0

analysis:
  watchlist:
    - epic: GOLD
      display: Gold
      news_query: gold XAUUSD bullion price
    - epic: OIL_BRENT
      display: Brent Oil Spot
      news_query: Brent crude oil OPEC supply
    - epic: OIL_CRUDE
      display: Crude Oil Spot
      news_query: WTI crude oil inventories OPEC
    - epic: NATURALGAS
      display: Natural Gas
      news_query: natural gas Henry Hub storage weather
  structure_timeframe: H4
  entry_timeframe: H1
  atr_period: 14
  zone_tolerance_atr: 0.5
  min_target_separation_atr: 0.75
  max_stop_atr: 2.5
  min_reward_risk: 0.8
  news_lookback_hours: 24

# How long trades are planned for.
#   fixed  every instrument uses the timeframes above (structure/entry) and
#          management.management_timeframe.
#   auto   per instrument, at every analysis, the bot picks a style:
#            scalp     ~1-5 h   structure H1, levels M15, managed on M5
#            intraday  ~5-24 h  structure H4, levels H1,  managed on M15
#            swing     ~1-5 d   structure D1, levels H4,  managed on H1
#          It starts from the fastest allowed style and steps up only when
#          the slower chart has a strong trend (ADX) pointing the same way.
#          A trade keeps the style it was entered under until it closes.
style:
  mode: fixed
  allowed: [scalp, intraday]
  intraday_min_adx: 25
  swing_min_adx: 30

news:
  provider: none                  # marketaux | finnhub | none

llm:
  enabled: true
  model: claude-opus-5

# Gemini second opinion. Turned on by GEMINI_API_KEY in .env. It reads the
# same data and gives its own view on /now <symbol>, /report and the daily
# report, shown AFTER the bot's analysis with ALIGNED / CONFLICT / UNCERTAIN.
# It never changes a level, a lot size or the verdict. If it does not answer,
# Telegram says why (TIMEOUT, BAD_KEY, RATE_LIMITED, ...).
gemini:
  model: gemini-3.5-flash
  timeout: 25.0
  search_news: true        # news via Google Search; never guessed without it
  cache_minutes: 5.0

telegram:
  enabled: false                  # auto-enables when the token and chat id are set
  poll_seconds: 3.0

report:
  daily_time: "07:00"
  timezone: UTC
  intraday_refresh_hours: 4.0
  notify_on_bias_flip: true
  notify_on_level_invalidated: true
  output_dir: reports

  # Annotated chart images sent with every report. Candles are drawn in plain
  # ink so the only colour on the chart belongs to a decision: targets, the
  # stop, and the risk band between your entry and it.
  charts: true
  chart_theme: dark          # light | dark
  chart_timeframe: H1
  chart_bars: 120

  # HARD RISK LIMIT: the whole trade -- all deals together -- may lose at most
  # this share of account EQUITY if the stop is hit (spread included). The
  # stop itself stays technical; this only sizes the lots. When the broker's
  # minimum lot makes 3 deals too big, fewer deals are advised; when even 1
  # deal at the minimum is too big, the verdict is REJECTED -- RISK LIMIT.
  # 0 turns the check off. Needs MetaTrader 5 (it publishes contract values).
  risk_percent: 1.0
