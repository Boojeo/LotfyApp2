[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmbot"
version = "0.1.0"
description = "Semi-automated trade management and analytical assistant for Capital.com"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]

[project.scripts]
tmbot = "tmbot.cli:main"

[tool.setuptools.packages.find]
include = ["tmbot*"]
